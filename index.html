<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Tarefas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="cartao-aplicacao">

        <div class="cabecalho-aplicacao">
            <h1>Minha Lista de Tarefas</h1>

            <button class="botao-icon" id="botaoTema">
                🌙
            </button>
        </div>

        <div class="caixaentrada">

            <input 
                type="text" 
                id="entradaTarefa"
                placeholder="Digite uma tarefa..."
            >

            <button class="botao-principal" id="botaoAdicionar">
                Adicionar
            </button>

        </div>

        <ul class="listas-tarefas" id="listaTarefas">
        </ul>

        <div class="rodape-aplicacao">
            <p>Organize suas tarefas de forma simples.</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
